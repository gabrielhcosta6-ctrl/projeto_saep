<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Chamados</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h2>Painel de Gerenciamento</h2>
        
        <!-- Dashboard -->
        <div class="cards">
            <div class="card">Abertos: <b id="cntAberto">0</b></div>
            <div class="card">Em Andamento: <b id="cntAndamento">0</b></div>
            <div class="card">Concluídos: <b id="cntConcluido">0</b></div>
            <div class="card">Total: <b id="cntTotal">0</b></div>
        </div>

        <!-- Formulário de Cadastro -->
        <h3>Novo Chamado</h3>
        <form id="formChamado">
            <div class="form-group">
                <label>Título:</label>
                <input type="text" id="titulo" required>
            </div>
            <div class="form-group">
                <label>Descrição:</label>
                <textarea id="descricao" required></textarea>
            </div>
            <div class="form-group">
                <label>Categoria:</label>
                <input type="text" id="categoria" required>
            </div>
            <div class="form-group">
                <label>Prioridade:</label>
                <select id="prioridade" required>
                    <option value="baixa">Baixa</option>
                    <option value="média">Média</option>
                    <option value="alta">Alta</option>
                </select>
            </div>
            <div class="form-group">
                <label>Usuário Responsável:</label>
                <select id="usuario_id" required></select>
            </div>
            <button type="submit">Cadastrar Chamado</button>
        </form>

        <hr style="margin: 20px 0;">

        <!-- Filtros -->
        <h3>Listagem de Chamados</h3>
        <div style="display: flex; gap: 10px; margin-bottom: 10px;">
            <select id="filtroStatus" onchange="carregarChamados()">
                <option value="">Todos os Status</option>
                <option value="aberto">Aberto</option>
                <option value="em andamento">Em Andamento</option>
                <option value="concluído">Concluído</option>
            </select>
            <select id="filtroPrioridade" onchange="carregarChamados()">
                <option value="">Todas as Prioridades</option>
                <option value="baixa">Baixa</option>
                <option value="média">Média</option>
                <option value="alta">Alta</option>
            </select>
        </div>

        <!-- Tabela de Chamados -->
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Título</th>
                    <th>Categoria</th>
                    <th>Prioridade</th>
                    <th>Status</th>
                    <th>Responsável</th>
                    <th>Criação</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabelaChamados"></tbody>
        </table>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
